<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>conversation-memory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --text-dim: #8b93a3;
    --accent: #6ea8fe;
    --accent-dim: #2a3f5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 28px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--text-dim); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 20px 80px; }
  .hour {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .hour-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
  }
  .hour-head:hover { background: #1c2029; }
  .hour-title { font-size: 14px; font-weight: 600; }
  .hour-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .hour-actions { display: flex; align-items: center; gap: 10px; }
  button {
    background: var(--accent-dim);
    color: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { filter: brightness(1.2); }
  button:disabled { opacity: 0.5; cursor: default; }
  .body { border-top: 1px solid var(--border); display: none; }
  .body.open { display: block; }
  .summary {
    padding: 14px 18px;
    background: #12151b;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    color: #cfd6e2;
  }
  .summary.empty { color: var(--text-dim); font-style: italic; }
  .segments { padding: 4px 18px 14px; }
  .segment { padding: 7px 0; font-size: 13px; line-height: 1.5; border-bottom: 1px solid #1c2029; }
  .segment:last-child { border-bottom: none; }
  .segment .speaker { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .segment .speaker.unresolved { color: var(--text-dim); }
  .empty-state { color: var(--text-dim); font-size: 13px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>conversation-memory</h1>
  <span class="status" id="status">connecting…</span>
</header>
<main id="hours"><div class="empty-state">Loading…</div></main>

<script>
const hoursEl = document.getElementById("hours");
const statusEl = document.getElementById("status");
const state = {}; // hour_key -> { open, segmentsLoaded, summary }
let lastBucketsKey = null; // skip re-render when nothing actually changed

function fmtHour(hourKey) {
  const [date, hour] = hourKey.split("T");
  const d = new Date(`${date}T${hour}:00:00`);
  const start = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const end = new Date(d.getTime() + 3600000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const dateLabel = d.toLocaleDateString([], { month: "short", day: "numeric" });
  return `${dateLabel} · ${start}–${end}`;
}

async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
}

async function refreshHours() {
  try {
    const buckets = await fetchJSON("/api/hours");
    statusEl.textContent = buckets.length ? "live" : "waiting for transcripts…";
    if (!buckets.length) {
      hoursEl.innerHTML = '<div class="empty-state">No transcripts yet — start daemon.py and talk near the mic.</div>';
      return;
    }
    for (const b of buckets) {
      if (!state[b.hour_key]) state[b.hour_key] = { open: false, segmentsLoaded: false, summary: null };
    }
    // Skip the rebuild entirely when nothing actually changed -- otherwise every 4s poll
    // wipes and rebuilds the whole list, which resets scroll to the top mid-read.
    const bucketsKey = JSON.stringify(buckets);
    if (bucketsKey === lastBucketsKey) return;
    lastBucketsKey = bucketsKey;
    render(buckets);
  } catch (e) {
    statusEl.textContent = "disconnected — is web_ui.py running?";
  }
}

function render(buckets) {
  const scrollY = window.scrollY;
  hoursEl.innerHTML = "";
  for (const b of buckets) {
    const s = state[b.hour_key];
    const card = document.createElement("div");
    card.className = "hour";

    const head = document.createElement("div");
    head.className = "hour-head";
    head.innerHTML = `
      <div>
        <div class="hour-title">${fmtHour(b.hour_key)}</div>
        <div class="hour-meta">${b.segment_count} segment${b.segment_count === 1 ? "" : "s"}</div>
      </div>
      <div class="hour-actions">
        <button data-action="summarize" data-hour="${b.hour_key}">
          ${b.has_summary ? "↻ re-summarize" : "⚡ summarize"}
        </button>
      </div>`;
    head.querySelector(".hour-title, .hour-meta")?.addEventListener?.("click", () => toggle(b.hour_key));
    head.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      toggle(b.hour_key);
    });
    head.querySelector("button").addEventListener("click", async (e) => {
      e.stopPropagation();
      await summarize(b.hour_key, e.target);
    });

    const body = document.createElement("div");
    body.className = "body" + (s.open ? " open" : "");
    body.id = `body-${b.hour_key}`;

    card.appendChild(head);
    card.appendChild(body);
    hoursEl.appendChild(card);

    if (s.open) loadBody(b.hour_key);
  }
  window.scrollTo(0, scrollY);
}

function toggle(hourKey) {
  state[hourKey].open = !state[hourKey].open;
  const body = document.getElementById(`body-${hourKey}`);
  if (body) body.classList.toggle("open", state[hourKey].open);
  if (state[hourKey].open) loadBody(hourKey);
}

async function loadBody(hourKey) {
  const body = document.getElementById(`body-${hourKey}`);
  if (!body) return;
  const s = state[hourKey];

  const [summaryRes, segments] = await Promise.all([
    s.summary === null ? fetchJSON(`/api/hours/${hourKey}/summary`) : Promise.resolve({ summary: s.summary }),
    fetchJSON(`/api/hours/${hourKey}/segments`),
  ]);
  s.summary = summaryRes.summary;

  const summaryHtml = s.summary
    ? `<div class="summary">${escapeHtml(s.summary)}</div>`
    : `<div class="summary empty">No summary yet — click "summarize" above.</div>`;

  const segmentsHtml = segments
    .map(
      (seg) =>
        `<div class="segment"><span class="speaker${seg.voiceprint_id ? "" : " unresolved"}">${escapeHtml(
          seg.label
        )}:</span>${escapeHtml(seg.text)}</div>`
    )
    .join("");

  body.innerHTML = summaryHtml + `<div class="segments">${segmentsHtml}</div>`;
}

async function summarize(hourKey, btn) {
  btn.disabled = true;
  btn.textContent = "summarizing…";
  try {
    const { summary } = await fetchJSON(`/api/hours/${hourKey}/summary`, { method: "POST" });
    state[hourKey].summary = summary;
    if (!state[hourKey].open) toggle(hourKey);
    else loadBody(hourKey);
    btn.textContent = "↻ re-summarize";
  } catch (e) {
    btn.textContent = "failed — retry";
  } finally {
    btn.disabled = false;
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

refreshHours();
setInterval(refreshHours, 4000);
</script>
</body>
</html>
